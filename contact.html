<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Contact - Bissas</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com/css?family=Quicksand:400,400i,500,500i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
		<!-- CSS Files -->
		<link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
		<link href="css/font-awesome.css" rel="stylesheet">
		<link href="css/style.css" rel="stylesheet">
		<link href="css/responsive.css" rel="stylesheet">

		<!-- Modernizr JS File -->
		<script src="js/modernizr-custom.js"></script>
	</head>

	<body>
	
		<!-- START PRELOADER  -->	
		<div class="preloader">
			<div class="status">
				<div class="lds-roller"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
			</div>
		</div>
		<!-- END PRELOADER -->	
		
		<!-- Header Start -->
		<header class="header-area">
			<a id="menu-btn" href="#"><i class="fas fa-bars"></i></a>
			<a id="close-btn" href="#"><i class="fas fa-times"></i></a>
			
			<!--  Navigation Start -->
			<ul class="main-menu">
            <li><a href="{% url 'home' %}" data-toggle="tooltip" data-placement="right" title="首页"><span class="dot"></span></a></li>
<li><a href="{% url 'about' %}" data-toggle="tooltip" data-placement="right" title="自我介绍"><span class="dot"></span></a></li>
<li><a href="{% url 'contact' %}" data-toggle="tooltip" data-placement="right" title="留言"><span class="dot"></span></a></li>
        </ul>
			<!-- Navigation End -->
		</header>
		<!-- Header Ends -->

		<!-- Main Content Starts -->
		<section class="container section-padding">
			<div class="banner-bg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url(img/background.jpg); z-index: -1;"></div>
		
			<div class="row">
				<div class="col-lg-5 col-md-4 col-sm-12 col-12">
					<div class="cont-info">
						<h1>给我留言</h1>
					</div>
					<h5 class="social-title">看得比较少哈</h5>
				</div>			

				<div class="col-lg-7 col-md-8 col-sm-12 col-12">
					<div class="contact-form">		
						<form id="contact-form" method="POST">
							<div class="row">
								<div class="col-md-6 col-12">
									<div class="form-group">
										<input name="Name" id="name" placeholder="名字" class="form-control" type="text">
									</div>
								</div>
								<div class="col-md-6 col-12">
									<div class="form-group">
										<input name="Email" id="email" placeholder="联系方式" class="form-control" type="email">
									</div>
								</div>
								<div class="col-12 col-12">
									<div class="form-group">
										<input name="Subject" id="subject" placeholder="叫我干啥" class="form-control" type="text">
									</div>
								</div>
								<div class="col-md-12 col-12">
									<div class="form-group">
										<textarea name="message" id="message" placeholder="具体讲讲" rows="3" class="form-control" spellcheck="false"></textarea>
									</div>
								</div>
								<div class="col-md-12 col-12 text-left">									
									<button class="global-btn" type="submit" value="Send">提交</button>
								</div>
							</div>
						</form>
					</div>						
				</div>						
			</div>								
		</section>
		<!-- Main Content Ends -->

		<!-- JS Files -->
		<script src="js/jquery.js"></script>
		<script src="bootstrap/js/popper.min.js"></script>
		<script src="bootstrap/js/bootstrap.min.js"></script>
		<script src="js/venobox.min.js"></script>
		<script src="js/isotope.pkgd.min.js"></script>
		<script src="js/imagesloaded.pkgd.js"></script>
		<script src="js/scripts.js"></script>

	</body>
</html>
